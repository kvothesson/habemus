function fmt(n){
  if(n<1e6){if(n<10&&n%1)return n.toFixed(1).replace('.',',');return Math.floor(n).toLocaleString('es-AR')}
  for(const[v,nm]of ESC)if(n>=v){const q=n/v;if(q>=1000&&v<1e30)return(q/1000).toFixed(2).replace('.',',')+' mil '+nm;return q.toFixed(2).replace('.',',')+' '+nm}
}
function corto(n){if(n<1e4)return fmt(n);const u=[[1e12,'B'],[1e9,'MM'],[1e6,'M'],[1e3,'k']];for(const[v,s]of u)if(n>=v){const q=n/v;return(q>=100?Math.floor(q):q.toFixed(1).replace('.',','))+s}}

let ac=null,mudo=false,master=null;
function audio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return ac}
function salida(){const a=audio();if(!a)return null;if(!master){master=a.createGain();master.gain.value=mudo?0:.9;master.connect(a.destination)}return master}
const PENTA=[523.25,587.33,659.25,783.99,880,1046.5];
function campana(f,vol=.06,dur=.7,t0=0){const a=audio(),o2=salida();if(!o2)return;const t=a.currentTime+t0;for(const[m,v]of[[1,1],[2.76,.35],[5.4,.12]]){const o=a.createOscillator(),g=a.createGain();o.frequency.value=f*m;g.gain.setValueAtTime(vol*v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur/m**.3);o.connect(g).connect(o2);o.start(t);o.stop(t+dur)}}
function organo(notas,dur=.5,vol=.05){const a=audio(),o2=salida();if(!o2)return;const t=a.currentTime;const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;lp.connect(o2);for(const f of notas)for(const m of[1,2]){const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=f*m;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol/m,t+.03);g.gain.setValueAtTime(vol/m,t+dur*.6);g.gain.linearRampToValueAtTime(0,t+dur);o.connect(g).connect(lp);o.start(t);o.stop(t+dur+.05)}}
function golpe(t,vol=.25){const a=ac,o2=salida();if(!o2)return;const o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(45,t+.15);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g).connect(o2);o.start(t);o.stop(t+.24)}
let RUIDO=null;
function redoble(t,vol=.03){const a=ac,o2=salida();if(!o2)return;if(!RUIDO){RUIDO=a.createBuffer(1,a.sampleRate*.1,a.sampleRate);const d=RUIDO.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const n=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();n.buffer=RUIDO;f.type='highpass';f.frequency.value=2500;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.07);n.connect(f).connect(g).connect(o2);n.start(t);n.stop(t+.08)}
function rasguido(t,vol,arriba){const a=ac,o2=salida();if(!o2)return;const notas=acordeAct.concat([acordeAct[0]*2]);(arriba?notas.slice().reverse():notas).forEach((f,q)=>{const o=a.createOscillator(),g=a.createGain(),tt=t+q*.012;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(vol,tt);g.gain.exponentialRampToValueAtTime(.0005,tt+.35);o.connect(g).connect(o2);o.start(tt);o.stop(tt+.4)})}
function bombo(){const a=audio();if(!a)return;golpe(a.currentTime);golpe(a.currentTime+.18)}
function arrullo(){const a=audio(),o2=salida();if(!o2)return;const t=a.currentTime;for(let k=0;k<2;k++){const o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(1400,t+k*.12);o.frequency.exponentialRampToValueAtTime(2200,t+k*.12+.08);g.gain.setValueAtTime(.04,t+k*.12);g.gain.exponentialRampToValueAtTime(.0001,t+k*.12+.1);o.connect(g).connect(o2);o.start(t+k*.12);o.stop(t+k*.12+.12)}}
function bocina(){const a=audio(),o2=salida();if(!o2)return;const t=a.currentTime;for(const k of[0,.18]){const o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=392;g.gain.setValueAtTime(.025,t+k);g.gain.setValueAtTime(0,t+k+.12);o.connect(g).connect(o2);o.start(t+k);o.stop(t+k+.13)}}
function ovacion(){const a=audio(),o2=salida();if(!o2)return;if(!RUIDO){redoble(a.currentTime,0)}const t=a.currentTime,n=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();n.buffer=RUIDO;n.loop=true;f.type='bandpass';f.frequency.value=1200;f.Q.value=.5;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.06,t+.5);g.gain.linearRampToValueAtTime(0,t+2.2);n.connect(f).connect(g).connect(o2);n.start(t);n.stop(t+2.3)}
function zum(){const a=audio(),o2=salida();if(!o2)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(60,t+.6);g.gain.setValueAtTime(.03,t);g.gain.linearRampToValueAtTime(0,t+.6);o.connect(g).connect(o2);o.start(t);o.stop(t+.65)}

  const fb=document.getElementById('fervor');fb.classList.toggle('on',fervor>.05);fb.firstElementChild.style.width=(fervor*100)+'%';
  const bf=[];if(humoT>0)bf.push(['humo','x7 '+Math.ceil(humoT)+'s','']);if(estampaT>0)bf.push(['estampa','x33 '+Math.ceil(estampaT)+'s','']);if(mateT>0)bf.push(['mate','x3 '+Math.ceil(mateT)+'s','']);if(nubes.length)bf.push(['nube','½ ¡tocalas!','malo']);for(const a of ACTIVAS)if((actT[a.id]||0)>0&&a.id!='agua')bf.push([a.ic,(a.id=='ola'?'clic x3 ':a.id=='incienso'?'x2 ':'x3 ')+Math.ceil(actT[a.id])+'s','']);if(panuelosT>0)bf.push(['panuelo','clic x2 '+Math.ceil(panuelosT)+'s','']);if(fervor>.05)bf.push(['mano','x'+(1+fervor).toFixed(1).replace('.',','),'']);
  const hb=bf.map(b=>`<div class="buff ${b[2]}">${img(b[0])}${b[1]}</div>`).join('');if(hb!=elBuffs._h){elBuffs._h=hb;elBuffs.innerHTML=hb}
}

// la pantalla entera es el juego: píxel entero, alto de unos 150-180 px de mundo
const elAct=document.getElementById('activas');let actFirma='';
function actualizarActivas(){const vis=ACTIVAS.filter((a,q)=>tieneA(a.id)||S.todo>=a.costo*.3||(q>0&&tieneA(ACTIVAS[q-1].id)&&S.todo>=a.costo*.1));
  const f=vis.map(a=>a.id+tieneA(a.id)).join();if(f!=actFirma){actFirma=f;elAct.innerHTML='';for(const a of vis){const b=document.createElement('button');b.className='act';b.innerHTML=img(a.ic)+'<div class="cd"></div><div class="tx"></div>';b.onclick=()=>{if(b._lp){b._lp=false;return}usarActiva(a)};b._a=a;tip(b,()=>`<b>${a.nom}</b>${a.txt}<br><i>${tieneA(a.id)?'Recarga: '+a.cd+' s':'Cuesta '+fmt(a.costo)+' fieles'}</i>`);elAct.appendChild(b)}}
  for(const b of elAct.children){const a=b._a,cd=actCD[a.id]||0,us=(actT[a.id]||0)>0,tx=b.querySelector('.tx'),c=b.querySelector('.cd');
    if(!tieneA(a.id)){b.className='act bloq';tx.textContent=corto(a.costo);c.style.height='0';b.disabled=S.f<a.costo;if(!b.disabled)b.classList.add('lista')}
    else{b.disabled=false;b.className='act'+(us?' usando':cd<=0?' lista':'');c.style.height=(cd>0?cd/a.cd*100:0)+'%';tx.textContent=us?Math.ceil(actT[a.id])+'':cd>0?Math.ceil(cd)+'':''}}}
function mostrarFin(){const m=Math.floor(S.tiempo/60),sg=Math.floor(S.tiempo%60);
  document.getElementById('finStats').innerHTML=`<span>${img('fiel')}Tiempo</span><span>${m} min ${sg} s</span><span>${img('mano')}Bendiciones</span><span>${fmt(S.clics)}</span><span>${img('cartel')}Gritos convertidos</span><span>${S.conversos||0}</span><span>${img('bebe')}Bebés bendecidos</span><span>${S.bebes}</span><span>${img('paloma')}Palomas</span><span>${S.palomas}</span><span>${img('estampa')}Hostias repartidas</span><span>${fmt(hostias)}</span>`;
  document.getElementById('fin').classList.add('on');organo([262,330,392,523],2.5,.06);setTimeout(()=>organo([349,440,523,698],2.5,.06),900)}
document.getElementById('otra').onclick=()=>{actoI=-1;uVis=-1;hostias=0;document.getElementById('fin').classList.remove('on');S=nuevo();derivar();nSpawn=0;guardar();refrescar(true)};
function ajustar(){EMAX=Math.max(1,Math.floor(Math.min(innerHeight/150,innerWidth/240)));EMIN=Math.max(1,Math.ceil(EMAX*.4));medir();aplicarEscala(Math.max(EMIN,Math.min(EMAX,cam.Et||EMAX)),false)}
function aplicarEscala(e,suave){const iw=innerWidth,ih=innerHeight,ant=ESC_CSS;ESC_CSS=e;tamano(Math.min(1000,Math.ceil(iw/e/2)*2),Math.ceil(ih/e/2)*2);cv.style.width=W*e+'px';cv.style.height=H*e+'px';cv.style.left=Math.max(0,(iw-W*e)/2)+'px';SESGO=(DOCKC-HUDC)/2/e;
  if(suave&&ant!=e){cv.style.transition='none';cv.style.transformOrigin='50% 25%';cv.style.transform='scale('+(ant/e)+')';void cv.offsetWidth;cv.style.transition='transform .8s ease-out';cv.style.transform='scale(1)';zum()}}
function medir(){HUDC=document.getElementById('hud').offsetHeight+8;DOCKC=document.getElementById('dock').offsetHeight;SESGO=(DOCKC-HUDC)/2/ESC_CSS;const dock=DOCKC;document.getElementById('toast').style.bottom=(dock+12)+'px'}
window.addEventListener('resize',ajustar);
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();salida();if(ac&&ac.state=='suspended')ac.resume();
  const r=cv.getBoundingClientRect(),ix=(e.clientX-r.left)/r.width*W,iy=(e.clientY-r.top)/r.height*H;
  const ir=izq.getBoundingClientRect(),cx=e.clientX-ir.left,cy=e.clientY-ir.top;
  for(let k=palomas.length-1;k>=0;k--){const p=palomas[k];if(Math.hypot(ix-p.x,iy-p.y)<12){palomas.splice(k,1);atraparPaloma(cx,cy);return}}
  for(let k=burbujas.length-1;k>=0;k--){const b=burbujas[k];if(b.sx!=null&&Math.hypot(ix-b.sx,iy-b.sy)<11){burbujas.splice(k,1);tocarBurbuja(b,cx,cy);return}}
  for(let k=nubes.length-1;k>=0;k--){const n=nubes[k];if(Math.abs(ix-n.x)<15&&Math.abs(iy-n.y)<10){nubes.splice(k,1);const g=fpsTotal()*3+valorClic();ganar(g);flota('+'+corto(g),cx,cy,'nube');campana(784);if(!nubes.length)toast('fiel','¡Salió el sol!');return}}
  bendecir(cx,cy);
});
window.addEventListener('keydown',e=>{const nk=parseInt(e.key);if(nk>=1&&nk<=ACTIVAS.length){const a=ACTIVAS[nk-1];if(tieneA(a.id))usarActiva(a);return}if(e.code=='Space'&&!e.repeat){e.preventDefault();const[x,y]=aPantallaCSS(SX(0),SY(-28));bendecir(x,y)}});
document.getElementById('mute').onclick=()=>{mudo=!mudo;document.getElementById('mute').textContent=mudo?'×':'♪';if(master)master.gain.setTargetAtTime(mudo?0:.9,ac.currentTime,.05)};

let foco=0,volver=0,acLejos=0,ult=performance.now(),acUI=0,acSave=0,acGrito=8,proxOla=25,acNota=0;
function paso(dt){
  T+=dt;blessT=Math.max(0,blessT-dt);humoT=Math.max(0,humoT-dt);estampaT=Math.max(0,estampaT-dt);mateT=Math.max(0,mateT-dt);humoVis=Math.max(0,humoVis-dt);
  panuelosT=Math.max(0,panuelosT-dt);fervorIdle+=dt;if(fervorIdle>.6)fervor=Math.max(0,fervor-dt*.35);
  ganar(fpsTotal()*dt);actualizarMultitud();
  if(foco>0)foco-=dt;cambioE-=dt;if(cam.Et!=ESC_CSS&&cambioE<=0){aplicarEscala(cam.Et,true);cambioE=1.2}const objL=cam.Lt;cam.L+=(objL-cam.L)*Math.min(1,dt*(foco>0?4:volver>0?2.5:1.5));volver=Math.max(0,volver-dt);if(foco>0&&foco<=dt)volver=3;if(cam.L<.003)cam.L=0;const Lq=(Math.abs(cam.L-cam.Lt)<.03&&foco<=0)?Math.round(cam.L*40)/40:cam.L,c=camDe(Lq);cam.s=c.s;cam.y=Math.round(c.y*c.s)/c.s;cam.x=Math.round(c.x*c.s)/c.s;if(actoI==0){const[qx,qy]=camPrevia();cam.x=Math.round(qx*cam.s)/cam.s;cam.y=Math.round(qy*cam.s)/cam.s}cam.vh=c.vh;cam.vw=c.vw;cam.Lg=Math.log2(EMAX/ESC_CSS)+cam.L;
  espPaso(dt);
  {const o=crowd.dmaxObj>1e8?(AREA?AREA.area.length*AREA.paso:1e4):crowd.dmaxObj,dif=o-crowd.dmax;if(dif>0)crowd.dmax+=Math.min(dif,(1.2+dif*.35)*dt);if(crowd.dmaxObj>1e8&&dif<=1)crowd.dmax=1e9}
  caminantesPaso(dt);eventosPaso(dt);historiaPaso(dt);previaPaso(dt);S.tiempo=(S.tiempo||0)+dt;
  if(S.run>=POB&&!S.fin){S.fin=1;medir('fin');setTimeout(mostrarFin,600)}
  pulsoMet-=dt;if(pulsoMet<=0){pulsoMet=60;medir('pulso')}
  if(cam.s<.7&&crowd.dmax>0&&actoI>0){acLejos+=dt*Math.min(60,10+Math.log10(fpsTotal()+1)*6);let intentos=0;while(acLejos>=1&&intentos++<80){const x=cam.x+(Math.random()-.5)*cam.vw,y=cam.y+(Math.random()-.5)*cam.vh,dd=distEn(x,y);if(dd>=65535||dd<=crowd.dmax+8||dd>crowd.dmax+260||!caminable(x,y))continue;acLejos--;const L=Math.hypot(x,y)||1,v=(10+Math.random()*8)/cam.s;parts.push({t:'p',x,y,vx:-x/L*v,vy:-y/L*v,g:0,life:Math.min(5,(dd-crowd.dmax)*UPM/v),c:MULT[(Math.random()*MULT.length)|0]})}acLejos=Math.min(acLejos,3)}
  if(false){while(acLejos>=1){acLejos--;const vb=cam.y+cam.vh/2,v=(14+Math.random()*10)/cam.s,lado=Math.random()<.3;const x=lado?(Math.random()<.5?-1:1)*(AV+6+Math.random()*16):(Math.random()*2-1)*Math.min(crowd.half,cam.vw/2)*.9;parts.push({t:'p',x,y:vb,vx:0,vy:-v,g:0,life:Math.max(.5,(vb-crowd.back+5)/v)+(lado?3:0),c:MULT[(Math.random()*MULT.length)|0]})}}
  if(olaT>=0){olaT+=dt*.45;if(olaT>1)olaT=-1}
  proxOla-=dt;if(proxOla<=0){proxOla=18+Math.random()*20;if(crowd.n>60)olaT=0}
  // palomas
  proxPaloma-=dt*D.palomaX;if(proxPaloma<=0){proxPaloma=45+Math.random()*55;const dir=Math.random()<.5?1:-1;palomas.push({x:dir>0?-8:W+8,y:14+Math.random()*40,dir,vx:dir*(16+Math.random()*6),ph:Math.random()*6})}
  for(let k=palomas.length-1;k>=0;k--){const p=palomas[k];p.x+=p.vx*dt;p.y+=Math.sin(T*3+p.ph)*dt*6;if(p.x<-20||p.x>W+20)palomas.splice(k,1)}
  // burbujas en la multitud: bebés, mates, carteles
  proxBurbuja-=dt*D.burbujaX;if(proxBurbuja<=0){proxBurbuja=6+Math.random()*8;if(burbujas.length<3&&crowd.n>=8){const l=lugarEnMultitud();if(l){const r=Math.random();burbujas.push({tipo:r<.4?'bebe':r<.65?'mate':'cartel',wx:l.wx,wy:l.wy,vida:6,ph:Math.random()*6})}}}
  for(let k=burbujas.length-1;k>=0;k--){burbujas[k].vida-=dt;if(burbujas[k].vida<=0)burbujas.splice(k,1)}
  // tormenta
  if(S.run>3000){proxTormenta-=dt;if(proxTormenta<=0&&!nubes.length){proxTormenta=(160+Math.random()*120)/Math.max(.25,D.tormentaX)*(D.tormentaX<1?2:1);const nn=3+((Math.random()*3)|0);for(let k=0;k<nn;k++)nubes.push({x:20+Math.random()*160,y:30+Math.random()*50,vx:(Math.random()-.5)*6,ph:Math.random()*6,vida:25})}}
  for(let k=nubes.length-1;k>=0;k--){const n=nubes[k];n.x+=n.vx*dt;n.vida-=dt;if(n.vida<=0)nubes.splice(k,1)}
  // partículas
  acNota+=dt;if(acNota>.3){acNota=0;
    if(S.n[1]>0&&Math.random()<Math.min(.9,.3+S.n[1]*.04)){const[x,y]=CORO_POS[(Math.random()*Math.min(24,S.n[1]))|0];parts.push({t:'n',x,y:y-7,vx:(Math.random()-.5)*3,vy:-7,g:0,life:1.6})}
    if(S.n[9]>0&&Math.random()<.6)parts.push({t:'h',x:-6+Math.random()*12,y:-36,vx:(Math.random()-.5)*6,vy:-9,g:0,life:1.8})}
  for(let k=parts.length-1;k>=0;k--){const p=parts[k];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt;p.life-=dt;if(p.life<=0)parts.splice(k,1)}
}
function tic(){if(enMenu){ult=performance.now();return}
  const now=performance.now(),dt=Math.min(1,(now-ult)/1000);ult=now;for(let r=dt;r>0;r-=.1)paso(Math.min(.1,r));
  acUI+=dt;if(acUI>.1){acUI=0;refrescar()}
  acSave+=dt;if(acSave>5){acSave=0;guardar()}
  if(actoI>0){proxViral-=dt;if(proxViral<=0&&!document.hidden){proxViral=120+Math.random()*60;momentoViral()}}
  acLoc-=dt;if(acLoc<=0&&!document.hidden&&crowd.n>10){acLoc=35+Math.random()*25;anunciar()}
  acGrito-=dt;if(acGrito<=0&&!document.hidden){acGrito=4+Math.random()*5;if(crowd.n>5){const l=lugarEnMultitud();if(l){const[x,y]=aPantallaCSS(SX(l.wx),SY(l.wy));const L=nubes.length?GRITOS_LLUVIA:GRITOS,par=L[(Math.random()*L.length)|0];grito(par[0],x,y-20,par)}}}
}

window.habemus={get S(){return S},get palomas(){return palomas},get burbujas(){return burbujas},get nubes(){return nubes},cam,paso,render,refrescar,derivar,fpsTotal,valorClic,bendecir:()=>bendecir(100,100),comprarGen,jubileo,
  saltar(L){actualizarMultitud();aplicarEscala(cam.Et,false);cam.L=cam.Lt;paso(0)},borrar(){uVis=-1;localStorage.removeItem(CLAVE);S=nuevo();derivar();refrescar(true)}};
document.getElementById('foto').onclick=()=>compartir(viralActual&&document.getElementById('viral').classList.contains('on')?viralActual:null);
document.getElementById('compEst').onclick=()=>{const m=Math.floor(S.tiempo/60);compartir('Convertí a toda la Argentina en '+m+' minutos en la misa del Papa.'+(S.barrio?' Desde '+S.barrio+'.':''),estampita())};
cargar();refrescar(true);ajustar();actualizarMultitud();crowd.dmax=crowd.dmaxObj;aplicarEscala(cam.Et,false);cam.L=cam.Lt;paso(0);nSpawn=crowd.n;if(S.fin)setTimeout(mostrarFin,300);
requestAnimationFrame(loop);
abrirMenu();
